# Parameters for one bot instance. Review the values before running.

# Bot identification and connection settings
name: "bot-sniper-2"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true # You can turn off the bot w/o removing its config
separate_process: true

# Options: "pump_fun" (default), "lets_bonk"
platform: "pump_fun"

# The logs listener doesn't use geyser. Every ${VAR} here must be set or the
# config fails to load, so the block stays commented out until it is needed.
# geyser:
#   endpoint: "${GEYSER_ENDPOINT}"
#   api_token: "${GEYSER_API_TOKEN}"
#   auth_type: "basic" # or "x-token"

# Trade execution: amount per trade and acceptable price deviation
trade:
  buy_amount: 0.002 # Amount of SOL to spend when buying (in SOL)
  # Also an entry filter in extreme_fast_mode: the buy asks for (1 - this) of
  # buy_amount's tokens at the launch price and caps spend at (1 + this), so
  # pump.fun rejects it once the price is above ~(1 + this) / (1 - this) of
  # launch. 0.025 refuses entries past ~1.05x: across 151 live trades only
  # entries within 5% of launch were net profitable.
  buy_slippage: 0.025
  sell_slippage: 0.3

  # Exit strategy configuration
  exit_strategy: "time_based" # Options: "time_based", "tp_sl", "manual"
  take_profit_percentage: 0.4 # Take profit at 40% gain (0.4 = 40%)
  stop_loss_percentage: 0.4 # Stop loss at 40% loss (0.4 = 40%)
  max_hold_time: 15 # Maximum hold time in seconds for TP/SL strategy, for time_based - see wait_after_buy
  price_check_interval: 2 # Check price every 2 seconds
  # A tp/sl exit sell can revert when the price moves under it. The bot re-reads
  # the price and retries; after this many attempts it gives up and leaves the
  # position open, tokens still held.
  max_exit_sell_attempts: 3
  # The last of those attempts accepts up to this fraction below the freshly
  # read price instead of sell_slippage, so a coin crashing faster than
  # sell_slippage per attempt is still sold rather than stranded. 0..1.
  final_exit_sell_slippage: 0.95

  # EXTREME FAST mode: skip the curve-stabilization wait and the price check,
  # buying a fixed token amount instead. Faster, but you don't learn the price
  # you paid. With geyser/logs/blocks the bot makes no RPC call at all between
  # detecting the coin and sending the buy.
  extreme_fast_mode: true
  extreme_fast_token_amount: 20 # Tokens to buy only when the coin has no reserves to price from

  # How long that read may take, in seconds, before the coin is SKIPPED. Raise
  # it to buy more coins on a slow endpoint, lower it to skip faster. Buying
  # without it reverts on-chain and still costs the fee.
  curve_refresh_budget: 2.0

  # Set false to make every listener do the pre-buy read, giving up the
  # zero-RPC path above.
  trust_create_event: true

  # Resend once a buy that reverted because the coin's creator moved to a
  # fee-sharing config after the create. Off: none of 9 such retries won.
  retry_moved_creator: false

# Priority fees: transaction speed vs cost.
# Note: dynamic mode costs an extra RPC call, which slows the buy.
priority_fees:
  enable_dynamic: false # Use latest transactions to estimate required fee (getRecentPrioritizationFees)
  enable_fixed: true # Use fixed amount below
  fixed_amount: 50_000 # Base fee in microlamports
  extra_percentage: 0.0 # Percentage increase on riority fee regardless of the calculation method (0.1 = 10%)
  hard_cap: 200_000 # Maximum allowable fee in microlamports to prevent excessive spending

# Compute unit limits for transaction processing
# Operation-specific defaults are used if not specified: buy=100K, sell=60K
compute_units:
  # Override default CU limits for this platform
  # buy: 100_000    # Buy operations (ATA creation + trading)
  # sell: 60_000    # Sell operations (just trading)

  # Account data size optimization (reduces CU cost and improves tx priority)
  # Reduces CU cost from 16k to ~128 CU by limiting loaded account data.
  # Default is 64MB (16k CU). Setting to 512KB significantly reduces overhead.
  # Note: Savings don't show in "consumed CU" but improve tx priority/cost.
  # Note (Nov 23, 2025): with data size set to 512KB, transactions fail - increasing to 12.5MB resolves the issue.
  # Reference: https://www.anza.xyz/blog/cu-optimization-with-setloadedaccountsdatasizelimit
  # account_data_size: 12_500_000  # Disabled: causes MaxLoadedAccountsDataSizeExceeded with Token-2022

# Filters for token selection
filters:
  match_string: null # Only process tokens with this string in name/symbol
  bro_address: null # Only trade tokens created by this user address
  # Pass on mayhem-mode coins: their sells can revert with Overflow (6024)
  # at any slippage when the curve holds less real SOL than it prices.
  skip_mayhem_mode: true
  listener_type: "logs" # Method for detecting new tokens: "logs", "blocks", or "geyser"
  max_token_age: 0.001 # Maximum token age in seconds for processing
  marry_mode: false # Only buy tokens, skip selling
  yolo_mode: false # Continuously trade tokens

# Retry and timeout settings
retries:
  max_attempts: 1 # Number of attempts for transaction submission
  wait_after_creation: 15 # Seconds to wait after token creation (only if EXTREME FAST is disabled)
  wait_after_buy: 15 # Holding period after buy transaction
  wait_before_new_token: 15 # Pause between token trades

# Token and account management
cleanup:
  # Cleanup mode determines when to manage token accounts. Options:
  # "disabled": no cleanup will occur.
  # "on_fail": only clean up if a buy transaction fails.
  # "after_sell": clean up after selling.
  # "post_session": clean up all empty accounts after a trading session ends.
  mode: "post_session"
  force_close_with_burn: false # Force burning remaining tokens before closing account
  with_priority_fee: false # Use priority fees for cleanup transactions

# Node provider configuration
node:
  max_rps: 25 # Maximum requests per second
